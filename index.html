
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODEHUB - Programming Quiz</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#101827;color:white;
}
header{
 background:#17243a;padding:20px;
 text-align:center;border-bottom:2px solid #22c55e;
}
.logo{font-size:27px;font-weight:bold}
.logo span{color:#22c55e}
header p{color:#bdc8d8}
.container{
 max-width:650px;margin:30px auto;padding:20px;
}
.card{
 background:#1d2b42;padding:24px;
 border-radius:16px;border:1px solid #34445c;
}
h2{text-align:center}
button,select{
 width:100%;padding:14px;margin-top:12px;
 border:0;border-radius:9px;font-size:16px;
}
select{background:#fff;color:#111}
button{
 background:#22c55e;color:#07140b;
 font-weight:bold;cursor:pointer;
}
button:hover{opacity:.85}
.option{
 background:#30415b;color:white;text-align:left;
 margin-top:10px;
}
.option:disabled{opacity:1;cursor:default}
.correct{background:#15803d!important}
.wrong{background:#b91c1c!important}
.secondary{background:#475569;color:white}
.small{color:#aebbd0;text-align:center}
#quiz,#result{display:none}
#progress{
 height:8px;background:#334155;
 border-radius:10px;margin:18px 0;
 overflow:hidden;
}
#bar{height:100%;width:0;background:#22c55e}
#feedback{line-height:1.5;margin-top:15px}
</style>
</head>
<body>

<header>
 <div class="logo">CODE<span>HUB</span></div>
 <p>Learn Coding. Test Yourself.</p>
</header>

<div class="container">

<div class="card" id="home">
 <h2>Welcome to CODEHUB!</h2>
 <p class="small">Choose your programming language</p>

 <select id="language">
  <option value="C">C Programming</option>
  <option value="Java">Java Programming</option>
  <option value="Python">Python Programming</option>
 </select>

 <button onclick="startQuiz()">START QUIZ</button>
 <p class="small">Free Programming Practice</p>
</div>

<div class="card" id="quiz">
 <p id="counter" class="small"></p>
 <div id="progress"><div id="bar"></div></div>
 <h2 id="question"></h2>
 <div id="options"></div>
 <p id="feedback"></p>
 <button id="next" onclick="nextQuestion()" style="display:none">
  NEXT QUESTION
 </button>
</div>

<div class="card" id="result">
 <h2>Quiz Completed!</h2>
 <h1 id="score" style="text-align:center;color:#22c55e"></h1>
 <p id="message" class="small"></p>
 <div id="review"></div>
 <button onclick="location.reload()">TRY AGAIN</button>
</div>

</div>

<script>
const questions = {
C:[
 {q:"Who developed the C language?",
  o:["Dennis Ritchie","James Gosling","Bjarne Stroustrup","Guido van Rossum"],a:0,e:"Dennis Ritchie developed C at Bell Labs."},
 {q:"Which symbol ends a C statement?",
  o:[";",":",".",","],a:0,e:"A semicolon terminates most C statements."},
 {q:"Which function is the usual entry point of a C program?",
  o:["start()","main()","run()","init()"],a:1,e:"Execution normally begins in main()."},
 {q:"Which header is needed for printf()?",
  o:["stdlib.h","string.h","stdio.h","math.h"],a:2,e:"stdio.h declares standard input/output functions."},
 {q:"Which format specifier is used for an int?",
  o:["%f","%c","%s","%d"],a:3,e:"%d is commonly used to print an int."},
 {q:"Which operator checks equality?",
  o:["=","==","!=","<="],a:1,e:"== compares two values."},
 {q:"Which loop executes its body at least once?",
  o:["for","while","do-while","None"],a:2,e:"do-while checks its condition after the body."},
 {q:"Which data type stores a single character?",
  o:["char","int","float","double"],a:0,e:"char stores a character value."},
 {q:"Which operator gives the remainder?",
  o:["/","*","%","+"],a:2,e:"The modulo operator % returns the remainder."},
 {q:"Which keyword returns a value from a function?",
  o:["break","return","continue","case"],a:1,e:"return sends a value back from a function."}
],
Java:[
 {q:"Who developed Java?",
  o:["Dennis Ritchie","James Gosling","Guido van Rossum","Ken Thompson"],a:1,e:"James Gosling led Java's development at Sun Microsystems."},
 {q:"Which keyword creates an object?",
  o:["class","new","this","static"],a:1,e:"The new keyword creates an object."},
 {q:"Which method is the usual Java entry point?",
  o:["start()","run()","main()","execute()"],a:2,e:"Java applications commonly start at main()."},
 {q:"Which type stores true or false?",
  o:["int","boolean","char","String"],a:1,e:"boolean stores true or false."},
 {q:"Which symbol ends a Java statement?",
  o:[";",":",".",","],a:0,e:"A semicolon ends most Java statements."},
 {q:"Which keyword inherits a class?",
  o:["implements","extends","inherits","super"],a:1,e:"extends is used for class inheritance."},
 {q:"Which keyword prevents class inheritance?",
  o:["static","private","final","void"],a:2,e:"A final class cannot be subclassed."},
 {q:"Which package contains Scanner?",
  o:["java.io","java.util","java.net","java.lang"],a:1,e:"Scanner is in java.util."},
 {q:"Which operator compares primitive values for equality?",
  o:["=","==","+=","&&"],a:1,e:"== compares primitive values."},
 {q:"Which keyword refers to the current object?",
  o:["super","this","self","current"],a:1,e:"this refers to the current object."}
],
Python:[
 {q:"Who created Python?",
  o:["James Gosling","Dennis Ritchie","Guido van Rossum","Brendan Eich"],a:2,e:"Guido van Rossum created Python."},
 {q:"Which function displays output?",
  o:["echo()","print()","display()","write()"],a:1,e:"print() displays output."},
 {q:"Which symbol starts a comment?",
  o:["//","#","/*","--"],a:1,e:"# starts a Python comment."},
 {q:"Which data type stores True or False?",
  o:["int","str","bool","list"],a:2,e:"bool is Python's Boolean type."},
 {q:"Which brackets create a list?",
  o:["()","{}","[]","<>"],a:2,e:"Square brackets create a list."},
 {q:"Which keyword defines a function?",
  o:["function","def","fun","define"],a:1,e:"def defines a function."},
 {q:"Which operator means exponentiation?",
  o:["^","**","//","%"],a:1,e:"** performs exponentiation."},
 {q:"Which method adds an item to a list?",
  o:["add()","insertEnd()","append()","push()"],a:2,e:"append() adds an item at the end."},
 {q:"Which keyword is used for a condition?",
  o:["if","when","check","case"],a:0,e:"if begins a conditional statement."},
 {q:"What is the result of 10 // 3?",
  o:["3.33","3","1","4"],a:1,e:"// performs floor division, giving 3."}
]
};

let currentQuestions=[];
let index=0;
let score=0;
let answered=false;
let results=[];

function startQuiz(){
 const lang=document.getElementById("language").value;
 currentQuestions=questions[lang];
 index=0;score=0;results=[];
 document.getElementById("home").style.display="none";
 document.getElementById("result").style.display="none";
 document.getElementById("quiz").style.display="block";
 showQuestion();
}

function showQuestion(){
 answered=false;
 const q=currentQuestions[index];
 document.getElementById("counter").textContent=
 "Question "+(index+1)+" of "+currentQuestions.length;
 document.getElementById("bar").style.width=
 (index/currentQuestions.length*100)+"%";
 document.getElementById("question").textContent=q.q;
 document.getElementById("feedback").textContent="";
 document.getElementById("next").style.display="none";
 const box=document.getElementById("options");
 box.innerHTML="";
 q.o.forEach((option,i)=>{
  const btn=document.createElement("button");
  btn.className="option";
  btn.textContent=String.fromCharCode(65+i)+". "+option;
  btn.onclick=()=>checkAnswer(i);
  box.appendChild(btn);
 });
}

function checkAnswer(choice){
 if(answered)return;
 answered=true;
 const q=currentQuestions[index];
 const buttons=document.querySelectorAll(".option");
 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(i===q.a)b.classList.add("correct");
  if(i===choice && choice!==q.a)b.classList.add("wrong");
 });
 if(choice===q.a)score++;
 results.push({question:q.q,chosen:q.o[choice],answer:q.o[q.a],correct:choice===q.a});
 document.getElementById("feedback").textContent=
 (choice===q.a?"Correct! ":"Wrong! ")+q.e;
 document.getElementById("next").style.display="block";
 document.getElementById("next").textContent=
 index===currentQuestions.length-1?"VIEW RESULT":"NEXT QUESTION";
}

function nextQuestion(){
 if(!answered)return;
 index++;
 if(index<currentQuestions.length){
  showQuestion();
 }else{
  showResult();
 }
}

function showResult(){
 document.getElementById("quiz").style.display="none";
 document.getElementById("result").style.display="block";
 document.getElementById("score").textContent=
 score+" / "+currentQuestions.length;
 document.getElementById("message").textContent=
 "You scored "+Math.round(score/currentQuestions.length*100)+"%. Keep practicing!";
 document.getElementById("bar").style.width="100%";
 const review=document.getElementById("review");
 review.innerHTML="<h3>Answer Review</h3>";
 results.forEach((r,i)=>{
  const p=document.createElement("p");
  p.textContent=(i+1)+". "+r.question+
  " | Your answer: "+r.chosen+
  " | Correct answer: "+r.answer+
  " | "+(r.correct?"Correct":"Incorrect");
  review.appendChild(p);
 });
}
</script>
</body>
</html>
